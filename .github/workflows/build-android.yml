name: Build Android APK

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'com.elrocio.app/package-lock.json'

    - name: Instalar dependencias de Node
      working-directory: ./com.elrocio.app
      run: npm install

    - name: Construir la Web App (Vite)
      working-directory: ./com.elrocio.app
      run: npm run build

    - name: Configurar Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Sincronizar Capacitor
      working-directory: ./com.elrocio.app
      run: npx cap sync android

    - name: Compilar APK (Debug)
      working-directory: ./com.elrocio.app/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir el APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: El-Rocio-App-APK
        path: com.elrocio.app/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7